<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador RGB</title>
    <!-- Framework Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        
        .card-profile {
            border-radius: 20px;
            background-color: #ffffff;
            border: none;
        }
        .bg-gray-section {
            background-color: #e3e3e3;
        }
    </style>
</head>
<body>

    <div class="container-fluid p-0">

        
        <div class="row g-0">
            <div class="col-12 bg-primary text-white text-center py-4">
                <h1 class="fw-bold mb-0">Profile Card Design</h1>
            </div>
        </div>

        
        <div class="row g-0 bg-gray-section py-5 justify-content-center">
            <div class="col-11 col-xl-10">
              
                <div class="row justify-content-center">

                    
                    <div class="col-md-4 col-lg-3">
                        <div class="card-profile shadow p-4 text-center h-100 d-flex flex-column justify-content-between align-items-center">
                            <div>
                                <img src="assets/img/images (4).jpg" class="rounded-circle mb-3" style="width: 140px; height: 140px; object-fit: cover;" alt="Usuario 1">
                                <h5 class="fw-bold mb-3">Person One</h5>
                                <p class="text-secondary small">
                                     Esta es la persoa numero uno,
                                     para revisar la tarjeta
                                     perfil
                                </p>
                            </div>
                            <img src="assets/img/redes.jpg" style="height: 30px; width: auto;" alt="Redes sociales" class="mt-3">
                        </div>
                    </div>

                    <!-- Tarjeta 2 -->
                    <div class="col-md-4 col-lg-3">
                        <div class="card-profile shadow p-4 text-center h-100 d-flex flex-column justify-content-between align-items-center">
                            <div>
                                <img src="assets/img/perfil" class="rounded-circle mb-3" style="width: 140px; height: 140px; object-fit: cover;" alt="Usuario 2">
                                <h5 class="fw-bold mb-3">Person Two</h5>
                                <p class="text-secondary small">
                                     Esta es la persoa numero uno,
                                     para revisar la tarjeta de
                                     perfil
                                </p>
                            </div>
                            <img src="assets/img/redes.jpg" style="height: 30px; width: auto;" alt="Redes sociales" class="mt-3">
                        </div>
                    </div>

                    <!-- Tarjeta 3 -->
                    <div class="col-md-4 col-lg-3">
                        <div class="card-profile shadow p-4 text-center h-100 d-flex flex-column justify-content-between align-items-center">
                            <div>
                                <img src="assets/img/images (3).jpg" class="rounded-circle mb-3" style="width: 140px; height: 140px; object-fit: cover;" alt="Usuario 3">
                                <h5 class="fw-bold mb-3">Person Three</h5>
                                <p class="text-secondary small">
                                     Esta es la persoa numero uno,
                                     para revisar la tarjeta de     
                                     perfil
                                </p>
                            </div>
                            <img src="assets/img/redes.jpg" style="height: 30px; width: auto;">
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Banner inferior gris oscuro -->
        <div class="row g-0">
            <div class="col-12 bg-secondary text-white text-center py-4">
                <h2 class="mb-0">HTML CSS BOOTSTRAP</h2>
            </div>
        </div>

    </div>

</body>
</html>
